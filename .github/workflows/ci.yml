name: K-Scanner CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
      - name: Check C formatting
        run: |
          clang-format --version
          find src include -name "*.c" -o -name "*.h" | xargs clang-format --dry-run --Werror --output-replacements-xml | grep -q "<replacement " && { echo "Formatting issues found. Run: clang-format -i src/**/*.c include/*.h"; exit 1; } || echo "Formatting OK"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libncurses-dev
      - name: Build
        run: make clean && make
      - name: Verify binary
        run: ./kscanner --help
      - name: Check for banned functions
        run: '! grep -rn "\<gets(" src/ include/ || exit 1'
      - name: Shellcheck scripts
        run: |
          shellcheck --version
          shellcheck scripts/*.sh 2>/dev/null || echo "No scripts to check or shellcheck not available"

  coverage:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libncurses-dev lcov
      - name: Build with coverage
        run: make clean && make CFLAGS="-Wall -Wextra -Wpedantic -Iinclude -O0 -g -std=c99 -D_DEFAULT_SOURCE --coverage" LDFLAGS="-lncurses --coverage"
      - name: Run unit tests with coverage
        run: make test-unit
      - name: Generate coverage report
        run: |
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' 'tests/*' --output-file coverage.info
          lcov --list coverage.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: kscanner-coverage
          path: coverage.info
